services:

  app:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    command: sh -c "cp -rf /var/www/html/public/build/. /mnt/build/ && exec php-fpm"
    volumes:
      - storage:/var/www/html/storage/app
      - framework-cache:/var/www/html/storage/framework
      - logs:/var/www/html/storage/logs
      - public-build:/mnt/build
    env_file: .env
    environment:
      DB_HOST: mysql
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - internal

  queue:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    command: php artisan queue:work --tries=3 --timeout=90
    volumes:
      - storage:/var/www/html/storage/app
      - framework-cache:/var/www/html/storage/framework
      - logs:/var/www/html/storage/logs
    env_file: .env
    environment:
      DB_HOST: mysql
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - internal

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public:ro
      - public-build:/var/www/html/public/build:ro
    depends_on:
      - app
    networks:
      - internal

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    command: --skip-ssl --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-laravel}"
      MYSQL_USER: "${DB_USERNAME:-root}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-}"
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD:-}"
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

volumes:
  mysql-data:
  storage:
  framework-cache:
  logs:
  public-build:

networks:
  internal:
